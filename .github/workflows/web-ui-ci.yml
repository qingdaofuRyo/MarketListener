name: Web UI CI

on:
  push:
    branches: [master]
    paths:
      - "desktop/web/**"
      - "desktop/src/market_monitor/web_app.py"
      - "desktop/src/market_monitor/web_api/**"
      - "desktop/pyproject.toml"
      - ".github/workflows/web-ui-ci.yml"
  pull_request:
    paths:
      - "desktop/web/**"
      - "desktop/src/market_monitor/web_app.py"
      - "desktop/src/market_monitor/web_api/**"
      - "desktop/pyproject.toml"
      - ".github/workflows/web-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci
      - run: npm run verify:ui

  synthetic-e2e:
    name: synthetic Playwright
    needs: static
    runs-on: ubuntu-latest
    env:
      MARKETLISTENER_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - name: Install desktop service
        run: python -m pip install -e ./desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: Install web dependencies
        working-directory: desktop/web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: desktop/web
        run: npx playwright install --with-deps chromium
      - name: Build web bundle
        working-directory: desktop/web
        run: npm run build
      - name: Run targeted synthetic E2E
        working-directory: desktop/web
        run: npm run test:e2e:ui
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: desktop/web/playwright-report
          if-no-files-found: ignore
